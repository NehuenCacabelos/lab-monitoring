events {
    worker_connections 1024;
}

http {
    # ---------------------------------------------------------
    # Clúster de backend balanceado
    # ---------------------------------------------------------
    upstream backend_cluster {
        least_conn;
        server backend:5678;
    }

    # ---------------------------------------------------------
    # 1. Grafana (Puerto 80 -> http://localhost)
    # ---------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte WebSockets para Grafana Live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ---------------------------------------------------------
    # 2. Prometheus (Puerto 9090 -> http://localhost:9090)
    # ---------------------------------------------------------
    server {
        listen 9090;
        server_name localhost;

        location / {
            proxy_pass http://prometheus:9090;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---------------------------------------------------------
    # 3. Aplicación balanceada (Puerto 8080 -> http://localhost:8080)
    # ---------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ---------------------------------------------------------
    # 4. Métricas internas (Puerto 8081 - NO EXPUESTO AL HOST)
    # ---------------------------------------------------------
    server {
        listen 8081;
        server_name localhost nginx;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
